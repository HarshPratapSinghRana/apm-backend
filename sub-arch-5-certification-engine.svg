<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.05" />
    </filter>
    <linearGradient id="certHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
  </defs>
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: Consolas, monospace; }
  </style>

  <rect width="1440" height="820" fill="#F8FAFC" rx="16" />

  <!-- Title Banner -->
  <g transform="translate(40, 24)">
    <rect width="1360" height="66" rx="12" fill="url(#certHeaderGrad)" filter="url(#shadow)" />
    <text x="28" y="42" class="font-sans" font-size="20px" font-weight="800" fill="#FFFFFF">Sub-Architecture 5: 5-Pillar Continuous Quality &amp; Certification Engine</text>
    <text x="1332" y="42" text-anchor="end" class="font-sans" font-size="12.5px" font-weight="600" fill="#FDE68A">api/certificationEngine.js • Dynamic Health Score (DHS) • Anti-Gaming Anti-Sybil Rules</text>
  </g>

  <!-- Left: DHS Mathematical Formula & 5 Pillars -->
  <g transform="translate(40, 110)">
    <rect width="660" height="670" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="2" filter="url(#card-shadow)" />
    
    <rect width="660" height="48" rx="14" fill="#FFFBEB" />
    <rect y="34" width="660" height="14" fill="#FFFBEB" />
    <text x="20" y="31" class="font-sans" font-size="15px" font-weight="800" fill="#B45309">🏆 Dynamic Health Score (DHS) Mathematical Weighting</text>

    <!-- Formula Box -->
    <g transform="translate(20, 65)">
      <rect width="620" height="70" rx="8" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="12px" font-weight="800" fill="#78350F">DETERMINISTIC DHS SCORING ALGORITHM:</text>
      <text x="16" y="48" class="font-sans" font-size="13px" font-weight="800" fill="#92400E">DHS = 0.25*Adoption + 0.25*Feedback + 0.20*DX + 0.15*Security + 0.15*Reliability</text>
    </g>

    <!-- 5 Pillars Breakdown -->
    <g transform="translate(20, 145)">
      <rect width="620" height="495" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="13px" font-weight="800" fill="#0F172A">The 5 Evaluation Pillars</text>

      <!-- Pillar 1 -->
      <g transform="translate(16, 36)">
        <rect width="588" height="75" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" />
        <text x="12" y="18" class="font-sans" font-size="11.5px" font-weight="800" fill="#15803D">Pillar 1: Enterprise Adoption (Weight: 25%)</text>
        <text x="12" y="34" class="font-sans" font-size="10.5px" fill="#166534">• Evaluates unique enterprise users (U_active &gt;= 3) and total runs (I_total &gt;= 25)</text>
        <text x="12" y="50" class="font-sans" font-size="10.5px" font-weight="700" fill="#047857">🛡️ Anti-Gaming Velocity Cap: Max 5 counted runs per user per day</text>
        <text x="12" y="66" class="font-sans" font-size="10.5px" font-weight="700" fill="#DC2626">🚫 Author Excluded Rule: Submitter runs are strictly discarded from score calculation</text>
      </g>

      <!-- Pillar 2 -->
      <g transform="translate(16, 118)">
        <rect width="588" height="70" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
        <text x="12" y="18" class="font-sans" font-size="11.5px" font-weight="800" fill="#1D4ED8">Pillar 2: Community Developer Feedback (Weight: 25%)</text>
        <text x="12" y="34" class="font-sans" font-size="10.5px" fill="#1E3A8A">• Average star rating: Score = (R_avg / 5.0) * 100</text>
        <text x="12" y="50" class="font-sans" font-size="10.5px" fill="#1E3A8A">• Verified Usage Badge: Reviews weighted by verified in-IDE installation timestamps</text>
        <text x="12" y="64" class="font-sans" font-size="10px" font-weight="600" fill="#2563EB">Requires minimum 3 unique reviewer ratings before full weight unlocks</text>
      </g>

      <!-- Pillar 3 -->
      <g transform="translate(16, 195)">
        <rect width="588" height="70" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="18" class="font-sans" font-size="11.5px" font-weight="800" fill="#1E293B">Pillar 3: Developer Experience &amp; Documentation (Weight: 20%)</text>
        <text x="12" y="34" class="font-sans" font-size="10.5px" fill="#475569">• Manifest completeness (cip.yml / manifest.json with all required tags)</text>
        <text x="12" y="50" class="font-sans" font-size="10.5px" fill="#475569">• Time to First Execution (TTFE &lt;= 60s)</text>
        <text x="12" y="64" class="font-sans" font-size="10px" font-weight="600" fill="#0284C7">Presence of Step-by-Step "How to Use" guide (Agent @ vs Skill /)</text>
      </g>

      <!-- Pillar 4 -->
      <g transform="translate(16, 272)">
        <rect width="588" height="70" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" />
        <text x="12" y="18" class="font-sans" font-size="11.5px" font-weight="800" fill="#B91C1C">Pillar 4: Static Security &amp; Conformance (Weight: 15%)</text>
        <text x="12" y="34" class="font-sans" font-size="10.5px" fill="#991B1B">• Automated Semgrep &amp; Gitleaks scans (Zero leaked secrets or PATs)</text>
        <text x="12" y="50" class="font-sans" font-size="10.5px" fill="#991B1B">• Dependency vulnerability scans (npm audit / dotnet list package --vulnerable)</text>
        <text x="12" y="64" class="font-sans" font-size="10px" font-weight="700" fill="#DC2626">Hard Gate: Any high/critical finding immediately drops DHS score to 0</text>
      </g>

      <!-- Pillar 5 -->
      <g transform="translate(16, 349)">
        <rect width="588" height="75" rx="6" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1" />
        <text x="12" y="18" class="font-sans" font-size="11.5px" font-weight="800" fill="#6D28D9">Pillar 5: Operational Reliability &amp; Safety (Weight: 15%)</text>
        <text x="12" y="34" class="font-sans" font-size="10.5px" fill="#4C1D95">• Fatal Exception Rate: FER &lt;= 1.0% across all developer invocations</text>
        <text x="12" y="50" class="font-sans" font-size="10.5px" fill="#4C1D95">• Execution Latency SLA: &lt;= 2,500ms for atomic MCP tool functions</text>
        <text x="12" y="66" class="font-sans" font-size="10px" font-weight="600" fill="#7C3AED">Exemption: Complex autonomous coding agents have relaxed latency SLAs</text>
      </g>

      <text x="16" y="445" class="font-sans" font-size="11px" font-weight="600" fill="#059669">Continuous Re-Evaluation: Runs on every telemetry batch and review event.</text>
    </g>
  </g>

  <!-- Right: Hard Zero-Tolerance Gates & Badges -->
  <g transform="translate(740, 110)">
    <rect width="660" height="670" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="2" filter="url(#card-shadow)" />
    
    <rect width="660" height="48" rx="14" fill="#ECFDF5" />
    <rect y="34" width="660" height="14" fill="#ECFDF5" />
    <text x="20" y="31" class="font-sans" font-size="15px" font-weight="800" fill="#065F46">🛡️ Hard Zero-Tolerance Gates &amp; Enterprise Badges</text>

    <!-- Hard Gates Box -->
    <g transform="translate(20, 65)">
      <rect width="620" height="230" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="13px" font-weight="800" fill="#991B1B">4 Hard Zero-Tolerance Gates (Must Pass All)</text>
      <text x="16" y="45" class="font-sans" font-size="11.5px" fill="#7F1D1D">If any hard gate fails, certification is automatically revoked regardless of mathematical score:</text>

      <g transform="translate(16, 60)">
        <rect width="588" height="34" rx="4" fill="#FFFFFF" stroke="#FECACA" />
        <text x="12" y="21" class="font-sans" font-size="11px" font-weight="700" fill="#B91C1C">Gate 1: Zero Leaked Secrets</text>
        <text x="200" y="21" class="font-sans" font-size="10.5px" fill="#7F1D1D">No API keys, PATs, or enterprise credentials in files</text>
      </g>

      <g transform="translate(16, 100)">
        <rect width="588" height="34" rx="4" fill="#FFFFFF" stroke="#FECACA" />
        <text x="12" y="21" class="font-sans" font-size="11px" font-weight="700" fill="#B91C1C">Gate 2: SHA-256 Fingerprint</text>
        <text x="200" y="21" class="font-sans" font-size="10.5px" fill="#7F1D1D">Zip archive SHA-256 must match Git authoritative commit</text>
      </g>

      <g transform="translate(16, 140)">
        <rect width="588" height="34" rx="4" fill="#FFFFFF" stroke="#FECACA" />
        <text x="12" y="21" class="font-sans" font-size="11px" font-weight="700" fill="#B91C1C">Gate 3: Zero Crash Loops</text>
        <text x="200" y="21" class="font-sans" font-size="10.5px" fill="#7F1D1D">Fatal crash loop count must be exactly 0</text>
      </g>

      <g transform="translate(16, 180)">
        <rect width="588" height="34" rx="4" fill="#FFFFFF" stroke="#FECACA" />
        <text x="12" y="21" class="font-sans" font-size="11px" font-weight="700" fill="#B91C1C">Gate 4: Minimum 3 Unique Users</text>
        <text x="200" y="21" class="font-sans" font-size="10.5px" fill="#7F1D1D">Prevents single-developer self-certification gaming</text>
      </g>
    </g>

    <!-- Certification Badges -->
    <g transform="translate(20, 315)">
      <rect width="620" height="325" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="13px" font-weight="800" fill="#0F172A">Enterprise Certification Badges &amp; SLA Tiers</text>

      <!-- Badge 1: Certified -->
      <g transform="translate(16, 40)">
        <rect width="588" height="75" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.4" />
        <rect x="12" y="14" width="130" height="24" rx="12" fill="#D97706" />
        <text x="77" y="30" text-anchor="middle" class="font-sans" font-size="11.5px" font-weight="800" fill="#FFFFFF">⭐ CERTIFIED</text>
        
        <text x="155" y="24" class="font-sans" font-size="12px" font-weight="800" fill="#92400E">DHS Score: 85 — 100</text>
        <text x="155" y="40" class="font-sans" font-size="11px" fill="#78350F">Highest Enterprise Quality Tier • Promoted to Marketplace Featured Banner</text>
        <text x="155" y="56" class="font-sans" font-size="10.5px" font-weight="600" fill="#059669">Eligible for Enterprise Production Deployments &amp; Golden Template status</text>
      </g>

      <!-- Badge 2: Silver -->
      <g transform="translate(16, 125)">
        <rect width="588" height="75" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.4" />
        <rect x="12" y="14" width="130" height="24" rx="12" fill="#64748B" />
        <text x="77" y="30" text-anchor="middle" class="font-sans" font-size="11.5px" font-weight="800" fill="#FFFFFF">🥈 SILVER TIER</text>
        
        <text x="155" y="24" class="font-sans" font-size="12px" font-weight="800" fill="#334155">DHS Score: 70 — 84</text>
        <text x="155" y="40" class="font-sans" font-size="11px" fill="#475569">Approved Candidate • Undergoing enterprise adoption velocity gathering</text>
        <text x="155" y="56" class="font-sans" font-size="10.5px" font-weight="600" fill="#0284C7">Full functionality enabled for workspace development</text>
      </g>

      <!-- Badge 3: Community -->
      <g transform="translate(16, 210)">
        <rect width="588" height="75" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <rect x="12" y="14" width="130" height="24" rx="12" fill="#94A3B8" />
        <text x="77" y="30" text-anchor="middle" class="font-sans" font-size="11px" font-weight="800" fill="#FFFFFF">🥉 COMMUNITY</text>
        
        <text x="155" y="24" class="font-sans" font-size="12px" font-weight="800" fill="#475569">DHS Score: &lt; 70</text>
        <text x="155" y="40" class="font-sans" font-size="11px" fill="#64748B">Incubator / Early release • Requires peer reviews and verified runs</text>
        <text x="155" y="56" class="font-sans" font-size="10.5px" font-weight="600" fill="#EA580C">Shown with community badge in VS Code marketplace</text>
      </g>

      <text x="16" y="308" class="font-sans" font-size="11px" font-weight="600" fill="#1E293B">Registry State: Live evaluated scores stored in /certification/registry.json</text>
    </g>
  </g>
</svg>
