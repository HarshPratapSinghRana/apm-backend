name: Trigger auto deployment for apm-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main, Engineering-Commons-Code ]
    paths:
    - 'api/**'
    - 'Dockerfile'
    - 'package.json'
    - 'package-lock.json'
    - '.github/workflows/**'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo
      packages: write #Required to push to GitHub Container Registry (ghcr.io)

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APMBACKEND_AZURE_CLIENT_ID || secrets.CIPBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.APMBACKEND_AZURE_TENANT_ID || secrets.CIPBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.APMBACKEND_AZURE_SUBSCRIPTION_ID || secrets.CIPBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          containerAppName: apm-backend
          resourceGroup: apm-rg
          imageToBuild: ghcr.io/harshpratapsinghrana/apm-backend:${{ github.sha }}
