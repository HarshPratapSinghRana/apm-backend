<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.05" />
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: Consolas, monospace; }
  </style>

  <rect width="1440" height="820" fill="#F8FAFC" rx="16" />

  <!-- Title Banner -->
  <g transform="translate(40, 24)">
    <rect width="1360" height="66" rx="12" fill="url(#headerGrad)" filter="url(#shadow)" />
    <text x="28" y="42" class="font-sans" font-size="20px" font-weight="800" fill="#FFFFFF">Sub-Architecture 1: Client Extension &amp; Developer Workspace Subsystem</text>
    <text x="1332" y="42" text-anchor="end" class="font-sans" font-size="12.5px" font-weight="600" fill="#E0F2FE">engineering-commons-vscode v1.2.4 &amp; EngineeringCommonsCli (.NET 10)</text>
  </g>

  <!-- Left: VS Code Extension Architecture -->
  <g transform="translate(40, 110)">
    <rect width="660" height="670" rx="14" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" filter="url(#card-shadow)" />
    
    <rect width="660" height="48" rx="14" fill="#E0F2FE" />
    <rect y="34" width="660" height="14" fill="#E0F2FE" />
    <text x="20" y="31" class="font-sans" font-size="15px" font-weight="800" fill="#0369A1">🧩 VS Code Extension Internal Architecture (TypeScript / Webviews)</text>

    <!-- Component 1: Sidebar Webview -->
    <g transform="translate(20, 65)">
      <rect width="620" height="110" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="13px" font-weight="800" fill="#0369A1">1. Sidebar Webview Provider (engineeringCommonsSidebarWebviewProvider.ts)</text>
      <text x="16" y="45" class="font-sans" font-size="11.5px" fill="#334155">• Multi-Tab Navigation: Marketplace, My Work, Installed Workspace, Bounties, Notifications</text>
      <text x="16" y="65" class="font-sans" font-size="11.5px" fill="#334155">• Dynamic Filter Pills: Agents, Skills, Certified (DHS &gt;=85), AI Leap, MCP Tools, Prompts</text>
      <text x="16" y="88" class="font-sans" font-size="11.5px" font-weight="700" fill="#0284C7">✨ Glassmorphic Hover Popovers (#cip-rich-tooltip) with mouse-boundary tracking</text>
    </g>

    <!-- Component 2: Details Webview & How To Use Guide -->
    <g transform="translate(20, 190)">
      <rect width="620" height="120" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="13px" font-weight="800" fill="#1D4ED8">2. Artifact Details Webview Provider (artifactDetailsWebviewProvider.ts)</text>
      <text x="16" y="45" class="font-sans" font-size="11.5px" fill="#334155">• Full-page inspection: Version changelogs, 5-Pillar Scorecard, author metadata</text>
      <text x="16" y="65" class="font-sans" font-size="11.5px" fill="#334155">• Live In-Tab Code &amp; File Tree Viewer (Manifest, prompts, runtime logic)</text>
      <text x="16" y="90" class="font-sans" font-size="11.5px" font-weight="700" fill="#2563EB">📖 Step-by-Step "How to Use" Interactive Guide (Agent @ vs Skill / vs MCP)</text>
    </g>

    <!-- Component 3: Side-by-Side Review & Diff Panel -->
    <g transform="translate(20, 325)">
      <rect width="620" height="110" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="13px" font-weight="800" fill="#1E293B">3. Peer Review &amp; Inline Diff Engine (threadWebviewProvider.ts)</text>
      <text x="16" y="45" class="font-sans" font-size="11.5px" fill="#334155">• Multi-File PR-style Reviewer: Split (Side-by-Side) vs Unified Diff with 20px line heights</text>
      <text x="16" y="65" class="font-sans" font-size="11.5px" fill="#334155">• Line-level comment threads with real-time resolution and SLA countdown timers</text>
      <text x="16" y="88" class="font-sans" font-size="11.5px" font-weight="700" fill="#0F172A">⚖️ RBAC Reviewer Action Bar: Approve, Request Changes, Certify</text>
    </g>

    <!-- Component 4: Native Explorer TreeView & Tooltips -->
    <g transform="translate(20, 450)">
      <rect width="620" height="95" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="13px" font-weight="800" fill="#15803D">4. Native Explorer TreeView Provider (artifactTreeDataProvider.ts)</text>
      <text x="16" y="45" class="font-sans" font-size="11.5px" fill="#334155">• Displays Marketplace and Installed Workspace artifacts natively in the VS Code Activity Bar</text>
      <text x="16" y="68" class="font-sans" font-size="11.5px" font-weight="700" fill="#16A34A">🏷️ Rich MarkdownString Hover Tooltips with metadata tables, links, and health stats</text>
    </g>

    <!-- Component 5: Caching & Telemetry -->
    <g transform="translate(20, 560)">
      <rect width="620" height="85" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="13px" font-weight="800" fill="#92400E">5. Local Optimization &amp; Resiliency Layer</text>
      <text x="16" y="45" class="font-sans" font-size="11.5px" fill="#78350F">• 15-Minute In-Memory Catalog Cache (Eliminates redundant network traffic)</text>
      <text x="16" y="65" class="font-sans" font-size="11.5px" fill="#78350F">• 1-Hour Batched Telemetry Buffer (Zero performance impact during active editing)</text>
    </g>
  </g>

  <!-- Right: CLI & Work Timeline Tracker Architecture -->
  <g transform="translate(740, 110)">
    <rect width="660" height="670" rx="14" fill="#FFFFFF" stroke="#1E293B" stroke-width="2" filter="url(#card-shadow)" />
    
    <rect width="660" height="48" rx="14" fill="#F1F5F9" />
    <rect y="34" width="660" height="14" fill="#F1F5F9" />
    <text x="20" y="31" class="font-sans" font-size="15px" font-weight="800" fill="#0F172A">⌨️ CLI Architecture &amp; Work Timeline Tracker (.NET 10 / Node)</text>

    <!-- Component 1: Self-Contained CLI -->
    <g transform="translate(20, 65)">
      <rect width="620" height="140" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="13px" font-weight="800" fill="#0F172A">1. Self-Contained CLI Executables (EngineeringCommonsCli on .NET 10)</text>
      <text x="16" y="45" class="font-sans" font-size="11.5px" fill="#334155">• Bundled in resources/bin/ as engineering-commons.exe, engineering-commons.exe, EngineeringCommonsCli.exe</text>
      <text x="16" y="65" class="font-sans" font-size="11.5px" fill="#334155">• 100% Zero-Prerequisite: Requires NO .NET SDK or runtime on the developer host machine</text>
      <text x="16" y="85" class="font-sans" font-size="11.5px" fill="#334155">• Commands: login (Device Code), list, install, contribute, review, diff, status</text>
      <text x="16" y="110" class="font-sans" font-size="11.5px" font-weight="700" fill="#0284C7">⚙️ Validates package manifests (cip.yml), file trees, and SHA-256 signatures</text>
    </g>

    <!-- Component 2: Work Timeline Tracker Engine -->
    <g transform="translate(20, 220)">
      <rect width="620" height="230" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="13px" font-weight="800" fill="#6D28D9">2. Work Timeline Tracker Engine (.timeline/tracker.js)</text>
      <text x="16" y="46" class="font-sans" font-size="11.5px" fill="#334155">• Autonomous task lifecycle engine invoked via CLI or Antigravity/Copilot skill</text>
      <text x="16" y="66" class="font-sans" font-size="11.5px" fill="#334155">• Storage: Local workspace .timeline/tasks.json &amp; history.json</text>
      
      <!-- Lifecycle Stages -->
      <g transform="translate(16, 80)">
        <rect width="180" height="40" rx="6" fill="#EDE9FE" />
        <text x="12" y="18" class="font-sans" font-size="11px" font-weight="700" fill="#5B21B6">start &lt;taskId&gt;</text>
        <text x="12" y="32" class="font-sans" font-size="10px" fill="#6D28D9">Logs inception &amp; git branch</text>

        <rect x="200" width="180" height="40" rx="6" fill="#EDE9FE" />
        <text x="212" y="18" class="font-sans" font-size="11px" font-weight="700" fill="#5B21B6">checkpoint &lt;note&gt;</text>
        <text x="212" y="32" class="font-sans" font-size="10px" fill="#6D28D9">Logs incremental milestone</text>

        <rect x="400" width="180" height="40" rx="6" fill="#EDE9FE" />
        <text x="412" y="18" class="font-sans" font-size="11px" font-weight="700" fill="#5B21B6">complete &lt;summary&gt;</text>
        <text x="412" y="32" class="font-sans" font-size="10px" fill="#6D28D9">Exact duration &amp; close</text>
      </g>

      <text x="16" y="150" class="font-sans" font-size="11.5px" font-weight="700" fill="#7C3AED">📊 Reporting Output Capabilities:</text>
      <text x="16" y="172" class="font-sans" font-size="11px" fill="#4B5563">• Gantt-style ASCII visual execution timelines with active running pulse</text>
      <text x="16" y="192" class="font-sans" font-size="11px" fill="#4B5563">• Automated Daily Standup generator ("Yesterday I did... Today I will...")</text>
      <text x="16" y="212" class="font-sans" font-size="11px" fill="#4B5563">• Context switch tracking across git branches and work items</text>
    </g>

    <!-- Component 3: Workspace Target Directory Mapping -->
    <g transform="translate(20, 465)">
      <rect width="620" height="180" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="13px" font-weight="800" fill="#065F46">3. Workspace Target Directory Structure</text>
      
      <text x="16" y="50" class="font-sans" font-size="11.5px" fill="#047857"><strong>.github/agents/</strong> ➔ AI Agent prompt definitions (*.agent.md) for Copilot @agent</text>
      <text x="16" y="75" class="font-sans" font-size="11.5px" fill="#047857"><strong>skills/</strong> &amp; <strong>.agents/skills/</strong> ➔ AI Skill instructions (*SKILL.md) for Copilot /skill</text>
      <text x="16" y="100" class="font-sans" font-size="11.5px" fill="#047857"><strong>.cip/</strong> ➔ Local cache manifests, active locks (cip.lock.yaml), and dependency trees</text>
      <text x="16" y="125" class="font-sans" font-size="11.5px" fill="#047857"><strong>.timeline/</strong> ➔ Active developer tasks, context switches, and completed standup history</text>
      <text x="16" y="152" class="font-sans" font-size="11.5px" font-weight="700" fill="#059669">🔒 Never contaminates git history; all caches auto-ignored via .gitignore templates</text>
    </g>
  </g>
</svg>
