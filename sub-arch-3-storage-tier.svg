<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.05" />
    </filter>
    <linearGradient id="storageHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: Consolas, monospace; }
  </style>

  <rect width="1440" height="820" fill="#F8FAFC" rx="16" />

  <!-- Title Banner -->
  <g transform="translate(40, 24)">
    <rect width="1360" height="66" rx="12" fill="url(#storageHeaderGrad)" filter="url(#shadow)" />
    <text x="28" y="42" class="font-sans" font-size="20px" font-weight="800" fill="#FFFFFF">Sub-Architecture 3: Dual-Tier Zero-Cost CQRS Storage Architecture ($0.00/Mo)</text>
    <text x="1332" y="42" text-anchor="end" class="font-sans" font-size="12.5px" font-weight="600" fill="#A7F3D0">M365 SharePoint Online (Read Cache) + Azure DevOps Git (Authoritative Store)</text>
  </g>

  <!-- Left: Tier A - Microsoft 365 SharePoint Online -->
  <g transform="translate(40, 110)">
    <rect width="660" height="670" rx="14" fill="#FFFFFF" stroke="#0078D4" stroke-width="2" filter="url(#card-shadow)" />
    
    <rect width="660" height="48" rx="14" fill="#EFF6FF" />
    <rect y="34" width="660" height="14" fill="#EFF6FF" />
    <text x="20" y="31" class="font-sans" font-size="15px" font-weight="800" fill="#0078D4">☁️ Tier A: Microsoft 365 SharePoint Online (CQRS Read Cache)</text>

    <!-- Header Stats -->
    <g transform="translate(20, 65)">
      <rect width="620" height="70" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="13px" font-weight="800" fill="#0369A1">High-Speed Marketplace Read Layer (95% of Total Traffic)</text>
      <text x="16" y="45" class="font-sans" font-size="11.5px" fill="#334155">• Serves instant search, category filtering, and metadata queries without database costs</text>
      <text x="16" y="60" class="font-sans" font-size="11px" font-weight="700" fill="#0284C7">⚡ Included in Enterprise Microsoft 365 E3/E5 subscription ($0.00 incremental cost)</text>
    </g>

    <!-- 4 Dedicated Lists -->
    <g transform="translate(20, 150)">
      <rect width="620" height="240" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="13px" font-weight="800" fill="#0F172A">4 Dedicated Enterprise SharePoint Lists</text>

      <!-- List 1 -->
      <g transform="translate(16, 38)">
        <rect width="285" height="85" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="18" class="font-sans" font-size="11.5px" font-weight="700" fill="#0369A1">📋 Artifacts List</text>
        <text x="12" y="34" class="font-sans" font-size="10.5px" fill="#475569">Title, ArtifactId, Version, Type (Agent/Skill)</text>
        <text x="12" y="50" class="font-sans" font-size="10.5px" fill="#475569">Rating, Downloads, DHS Score, Certification</text>
        <text x="12" y="68" class="font-sans" font-size="10px" font-weight="600" fill="#059669">Indexed on: ArtifactId &amp; Type</text>
      </g>

      <!-- List 2 -->
      <g transform="translate(315, 38)">
        <rect width="285" height="85" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="18" class="font-sans" font-size="11.5px" font-weight="700" fill="#0369A1">⭐ Reviews List</text>
        <text x="12" y="34" class="font-sans" font-size="10.5px" fill="#475569">ArtifactId, AuthorEmail, Rating (1-5)</text>
        <text x="12" y="50" class="font-sans" font-size="10.5px" fill="#475569">Comment, VerifiedUsage, CreatedAt</text>
        <text x="12" y="68" class="font-sans" font-size="10px" font-weight="600" fill="#059669">Indexed on: ArtifactId</text>
      </g>

      <!-- List 3 -->
      <g transform="translate(16, 135)">
        <rect width="285" height="85" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="18" class="font-sans" font-size="11.5px" font-weight="700" fill="#0369A1">🎯 Bounties List</text>
        <text x="12" y="34" class="font-sans" font-size="10.5px" fill="#475569">BountyId, Title, RequestedSkill, Reward</text>
        <text x="12" y="50" class="font-sans" font-size="10.5px" fill="#475569">ClaimedBy, Status (Open / In Review / Solved)</text>
        <text x="12" y="68" class="font-sans" font-size="10px" font-weight="600" fill="#059669">Powers Community Crowdsourcing</text>
      </g>

      <!-- List 4 -->
      <g transform="translate(315, 135)">
        <rect width="285" height="85" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="18" class="font-sans" font-size="11.5px" font-weight="700" fill="#0369A1">🔔 Notifications List</text>
        <text x="12" y="34" class="font-sans" font-size="10.5px" fill="#475569">RecipientEmail, Title, Message, ReadStatus</text>
        <text x="12" y="50" class="font-sans" font-size="10.5px" fill="#475569">EventType (Review / Thread / Badge / Bounty)</text>
        <text x="12" y="68" class="font-sans" font-size="10px" font-weight="600" fill="#059669">Powers IDE Activity Bar Badge</text>
      </g>
    </g>

    <!-- Document Library & Graph API -->
    <g transform="translate(20, 405)">
      <rect width="620" height="235" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="13px" font-weight="800" fill="#15803D">Document Library &amp; Microsoft Graph API Integration</text>
      <text x="16" y="46" class="font-sans" font-size="11.5px" fill="#166534">• <strong>Engineering Commons Document Library:</strong> Stores pre-rendered ZIP packages and release assets</text>
      <text x="16" y="68" class="font-sans" font-size="11.5px" fill="#166534">• Fast binary downloads without incurring Git checkout overhead</text>
      <text x="16" y="90" class="font-sans" font-size="11.5px" fill="#166534">• <strong>Graph API Ingress:</strong> Queried using application permissions with client credential grant</text>
      <text x="16" y="112" class="font-sans" font-size="11px" font-family="Consolas, monospace" fill="#14532D">https://graph.microsoft.com/v1.0/sites/{site-id}/lists/{list-id}/items?$top=500</text>
      
      <rect x="16" y="130" width="588" height="35" rx="6" fill="#DCFCE7" />
      <text x="24" y="152" class="font-sans" font-size="11px" font-weight="700" fill="#15803D">🚀 Performance: Sub-60ms response times for catalog pagination across 250+ clients</text>

      <text x="16" y="185" class="font-sans" font-size="11.5px" font-weight="700" fill="#065F46">CQRS Invariant:</text>
      <text x="16" y="205" class="font-sans" font-size="11px" fill="#065F46">SharePoint is treated as an eventual-consistency read projection. If a conflict occurs, the Azure DevOps Git store is the ultimate single source of truth.</text>
    </g>
  </g>

  <!-- Right: Tier B - Azure DevOps Git Authoritative Store -->
  <g transform="translate(740, 110)">
    <rect width="660" height="670" rx="14" fill="#FFFFFF" stroke="#004C87" stroke-width="2" filter="url(#card-shadow)" />
    
    <rect width="660" height="48" rx="14" fill="#F0F9FF" />
    <rect y="34" width="660" height="14" fill="#F0F9FF" />
    <text x="20" y="31" class="font-sans" font-size="15px" font-weight="800" fill="#004C87">📦 Tier B: Azure DevOps Git Repository (Authoritative Store)</text>

    <!-- Header Stats -->
    <g transform="translate(20, 65)">
      <rect width="620" height="70" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="13px" font-weight="800" fill="#0F172A">Authoritative Git Source of Truth (5% of Total Traffic)</text>
      <text x="16" y="45" class="font-sans" font-size="11.5px" fill="#334155">• Enforces strict commit history, line-by-line diffs, signed PR approvals, and version tagging</text>
      <text x="16" y="60" class="font-sans" font-size="11px" font-weight="700" fill="#0284C7">🔒 Project: MAQInternalCIP-Engineering-Commons / Repo: Engineering Commons</text>
    </g>

    <!-- Authoritative Directories -->
    <g transform="translate(20, 150)">
      <rect width="620" height="310" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="13px" font-weight="800" fill="#0F172A">Authoritative Repository Directory Schema</text>

      <!-- Dir 1 -->
      <g transform="translate(16, 38)">
        <rect width="588" height="55" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="20" class="font-sans" font-size="12px" font-weight="700" fill="#0369A1">📁 /artifacts-json/ (121+ Authoritative Manifests)</text>
        <text x="12" y="38" class="font-sans" font-size="11px" fill="#475569">Individual JSON manifests specifying schema version, author, requirements, and tags.</text>
      </g>

      <!-- Dir 2 -->
      <g transform="translate(16, 102)">
        <rect width="588" height="55" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="20" class="font-sans" font-size="12px" font-weight="700" fill="#0369A1">📁 /certification/registry.json &amp; reviews.json</text>
        <text x="12" y="38" class="font-sans" font-size="11px" fill="#475569">Immutable evaluation snapshots, certified reviewer approval timestamps, and DHS scores.</text>
      </g>

      <!-- Dir 3 -->
      <g transform="translate(16, 166)">
        <rect width="588" height="55" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="20" class="font-sans" font-size="12px" font-weight="700" fill="#0369A1">📁 /governance/roles.json &amp; access-requests/</text>
        <text x="12" y="38" class="font-sans" font-size="11px" fill="#475569">Enterprise RBAC definitions (Admin, Reviewer, Producer, Consumer) and audit logs.</text>
      </g>

      <!-- Dir 4 -->
      <g transform="translate(16, 230)">
        <rect width="588" height="65" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="20" class="font-sans" font-size="12px" font-weight="700" fill="#0369A1">📁 /telemetry/events.json</text>
        <text x="12" y="38" class="font-sans" font-size="11px" fill="#475569">Aggregated daily telemetry records, invocation metrics, and anti-gaming velocity ledgers.</text>
        <text x="12" y="54" class="font-sans" font-size="10.5px" font-weight="600" fill="#059669">Commit-backed auditability prevents metric tampering.</text>
      </g>
    </g>

    <!-- Git REST Access & PAT Security -->
    <g transform="translate(20, 475)">
      <rect width="620" height="165" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="13px" font-weight="800" fill="#1D4ED8">Secure Server-Side Git REST Gateway</text>
      <text x="16" y="46" class="font-sans" font-size="11.5px" fill="#1E3A8A">• Vercel serverless backend communicates with Azure DevOps via REST API v7.1</text>
      <text x="16" y="68" class="font-sans" font-size="11.5px" fill="#1E3A8A">• Authenticated exclusively with server-side AZURE_DEVOPS_PAT</text>
      <text x="16" y="90" class="font-sans" font-size="11.5px" fill="#1E3A8A">• Zero consumer ADO licenses needed: 250 enterprise developers read/write through proxy</text>
      
      <rect x="16" y="110" width="588" height="35" rx="6" fill="#DBEAFE" />
      <text x="24" y="132" class="font-sans" font-size="11px" font-weight="700" fill="#1E40AF">💰 Saves $18,000/year by eliminating per-seat Azure DevOps Basic licenses for consumers</text>
    </g>
  </g>
</svg>
