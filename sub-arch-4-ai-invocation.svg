<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.05" />
    </filter>
    <linearGradient id="invocHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
  </defs>
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: Consolas, monospace; }
  </style>

  <rect width="1440" height="820" fill="#F8FAFC" rx="16" />

  <!-- Title Banner -->
  <g transform="translate(40, 24)">
    <rect width="1360" height="66" rx="12" fill="url(#invocHeaderGrad)" filter="url(#shadow)" />
    <text x="28" y="42" class="font-sans" font-size="20px" font-weight="800" fill="#FFFFFF">Sub-Architecture 4: Dual-Model AI Invocation Pipeline (Agents vs. Skills vs. MCP)</text>
    <text x="1332" y="42" text-anchor="end" class="font-sans" font-size="12.5px" font-weight="600" fill="#DDD6FE">GitHub Copilot Chat • Antigravity IDE • Claude Code Execution</text>
  </g>

  <!-- Left: AI AGENTS (@agent-name) -->
  <g transform="translate(40, 110)">
    <rect width="660" height="670" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#card-shadow)" />
    
    <rect width="660" height="48" rx="14" fill="#EFF6FF" />
    <rect y="34" width="660" height="14" fill="#EFF6FF" />
    <text x="20" y="31" class="font-sans" font-size="15px" font-weight="800" fill="#1D4ED8">🤖 AI AGENTS: Invocation via @ Selector in Copilot Chat</text>

    <!-- Path 1: Destination -->
    <g transform="translate(20, 65)">
      <rect width="620" height="110" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="13px" font-weight="800" fill="#0369A1">1. Target Installation Destination</text>
      <text x="16" y="48" class="font-sans" font-size="13px" font-family="Consolas, monospace" font-weight="700" fill="#1D4ED8">📁 .github/agents/{agent-name}.agent.md</text>
      <text x="16" y="70" class="font-sans" font-size="11.5px" fill="#334155">• Formatted with YAML frontmatter containing: name, description, tools, system directives</text>
      <text x="16" y="90" class="font-sans" font-size="11px" font-weight="600" fill="#0284C7">⚡ Recognized natively by GitHub Copilot Workspace as a specialized custom agent</text>
    </g>

    <!-- Path 2: How It Executes -->
    <g transform="translate(20, 190)">
      <rect width="620" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="13px" font-weight="800" fill="#0F172A">2. Step-by-Step Invocation Workflow</text>
      
      <text x="16" y="50" class="font-sans" font-size="11.5px" fill="#334155"><strong>Step 1:</strong> Click "Install to Workspace" in VS Code extension (or run CLI <code>install &lt;agent&gt;</code>)</text>
      <text x="16" y="72" class="font-sans" font-size="11.5px" fill="#334155"><strong>Step 2:</strong> Open GitHub Copilot Chat (<code>Ctrl+Alt+I</code> or <code>Cmd+Shift+I</code>)</text>
      <text x="16" y="94" class="font-sans" font-size="11.5px" fill="#334155"><strong>Step 3:</strong> Type <code>@</code> or open the Agent Dropdown picker at the top of the chat box</text>
      <text x="16" y="116" class="font-sans" font-size="11.5px" fill="#334155"><strong>Step 4:</strong> Select <code>@architecture-reviewer</code>, <code>@python-reviewer</code>, or <code>@work-timeline-tracker</code></text>
      <text x="16" y="138" class="font-sans" font-size="11.5px" font-weight="700" fill="#1D4ED8"><strong>Step 5:</strong> Send prompt: Copilot adopts the agent's persona, strict rules, and tools</text>
    </g>

    <!-- Path 3: Enterprise Examples -->
    <g transform="translate(20, 355)">
      <rect width="620" height="295" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="13px" font-weight="800" fill="#0F172A">3. Verified Official Agent Artifacts</text>

      <g transform="translate(16, 38)">
        <rect width="588" height="48" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
        <text x="12" y="18" class="font-sans" font-size="11.5px" font-weight="700" fill="#1D4ED8">@architecture-reviewer</text>
        <text x="12" y="34" class="font-sans" font-size="10.5px" fill="#1E3A8A">Principal Enterprise Solutions Architect • Microservices, SLA/SLO, Zero-Trust</text>
      </g>

      <g transform="translate(16, 92)">
        <rect width="588" height="48" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
        <text x="12" y="18" class="font-sans" font-size="11.5px" font-weight="700" fill="#1D4ED8">@python-reviewer &amp; @java-reviewer</text>
        <text x="12" y="34" class="font-sans" font-size="10.5px" fill="#1E3A8A">Language-specific deep code audits • OWASP Top 10 • Memory safety • Typing</text>
      </g>

      <g transform="translate(16, 146)">
        <rect width="588" height="48" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
        <text x="12" y="18" class="font-sans" font-size="11.5px" font-weight="700" fill="#1D4ED8">@go-reviewer, @cpp-reviewer &amp; @csharp-reviewer</text>
        <text x="12" y="34" class="font-sans" font-size="10.5px" fill="#1E3A8A">Goroutine leaks, RAII, pointer safety, Entity Framework Core queries</text>
      </g>

      <g transform="translate(16, 200)">
        <rect width="588" height="48" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
        <text x="12" y="18" class="font-sans" font-size="11.5px" font-weight="700" fill="#1D4ED8">@work-timeline-tracker</text>
        <text x="12" y="34" class="font-sans" font-size="10.5px" fill="#1E3A8A">Task inception, checkpoints, context switches, duration logs, ASCII timelines</text>
      </g>

      <text x="16" y="272" class="font-sans" font-size="11px" font-weight="600" fill="#059669">✅ All agents pass the 5-Pillar DHS Enterprise Certification Suite with &gt;=85 score</text>
    </g>
  </g>

  <!-- Right: AI SKILLS (/skill-name) -->
  <g transform="translate(740, 110)">
    <rect width="660" height="670" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="2" filter="url(#card-shadow)" />
    
    <rect width="660" height="48" rx="14" fill="#ECFDF5" />
    <rect y="34" width="660" height="14" fill="#ECFDF5" />
    <text x="20" y="31" class="font-sans" font-size="15px" font-weight="800" fill="#047857">⚡ AI SKILLS: Invocation via / Slash Command in Copilot &amp; Antigravity</text>

    <!-- Path 1: Destination -->
    <g transform="translate(20, 65)">
      <rect width="620" height="110" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="13px" font-weight="800" fill="#047857">1. Target Installation Destinations</text>
      <text x="16" y="48" class="font-sans" font-size="13px" font-family="Consolas, monospace" font-weight="700" fill="#065F46">📁 skills/{skill-name}/SKILL.md</text>
      <text x="16" y="68" class="font-sans" font-size="13px" font-family="Consolas, monospace" font-weight="700" fill="#065F46">📁 .agents/skills/{skill-name}/SKILL.md</text>
      <text x="16" y="90" class="font-sans" font-size="11px" font-weight="600" fill="#059669">⚡ On-demand procedural playbooks, helper scripts, and automated workflows</text>
    </g>

    <!-- Path 2: How It Executes -->
    <g transform="translate(20, 190)">
      <rect width="620" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="13px" font-weight="800" fill="#0F172A">2. Step-by-Step Invocation Workflow</text>
      
      <text x="16" y="50" class="font-sans" font-size="11.5px" fill="#334155"><strong>Step 1:</strong> Click "Install to Workspace" in VS Code extension (or run CLI <code>install &lt;skill&gt;</code>)</text>
      <text x="16" y="72" class="font-sans" font-size="11.5px" fill="#334155"><strong>Step 2:</strong> Open GitHub Copilot Chat (<code>Ctrl+Alt+I</code>) or Antigravity IDE Chat</text>
      <text x="16" y="94" class="font-sans" font-size="11.5px" fill="#334155"><strong>Step 3:</strong> Type <code>/</code> to trigger the slash commands autocomplete menu</text>
      <text x="16" y="116" class="font-sans" font-size="11.5px" fill="#334155"><strong>Step 4:</strong> Select <code>/work-timeline-tracker</code>, <code>/python-reviewer</code>, or custom skill</text>
      <text x="16" y="138" class="font-sans" font-size="11.5px" font-weight="700" fill="#059669"><strong>Step 5:</strong> AI assistant parses SKILL.md instructions and executes procedural steps</text>
    </g>

    <!-- Path 3: MCP Tools & Extension Integration -->
    <g transform="translate(20, 355)">
      <rect width="620" height="295" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
      <text x="16" y="24" class="font-sans" font-size="13px" font-weight="800" fill="#0F172A">3. MCP (Model Context Protocol) &amp; Script Integration</text>

      <g transform="translate(16, 38)">
        <rect width="588" height="60" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
        <text x="12" y="18" class="font-sans" font-size="11.5px" font-weight="700" fill="#92400E">Model Context Protocol (MCP) Tool Integration</text>
        <text x="12" y="34" class="font-sans" font-size="10.5px" fill="#78350F">Registered into .vscode/settings.json under "mcpServers" definitions.</text>
        <text x="12" y="50" class="font-sans" font-size="10.5px" fill="#78350F">Copilot automatically invokes functions (database query, git proxy, telemetry flush).</text>
      </g>

      <g transform="translate(16, 106)">
        <rect width="588" height="65" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
        <text x="12" y="18" class="font-sans" font-size="11.5px" font-weight="700" fill="#065F46">Procedural Scripts &amp; Local Automation</text>
        <text x="12" y="34" class="font-sans" font-size="10.5px" fill="#047857">Skills bundle scripts (e.g., scripts/tracker.js) executed via background tools.</text>
        <text x="12" y="52" class="font-sans" font-size="10.5px" font-weight="600" fill="#059669">Zero network dependencies; executes locally within workspace boundaries.</text>
      </g>

      <g transform="translate(16, 180)">
        <rect width="588" height="95" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
        <text x="12" y="20" class="font-sans" font-size="12px" font-weight="700" fill="#1D4ED8">Summary: When to choose Agent vs. Skill?</text>
        <text x="12" y="40" class="font-sans" font-size="11px" fill="#1E3A8A">• <strong>Use AI Agent (@):</strong> When you want an active, conversational persona (Senior Reviewer).</text>
        <text x="12" y="60" class="font-sans" font-size="11px" fill="#1E3A8A">• <strong>Use AI Skill (/):</strong> When you need a focused, repeatable, multi-step task playbook.</text>
        <text x="12" y="80" class="font-sans" font-size="11px" fill="#1E3A8A">• <strong>Use MCP:</strong> When you need AI models to query external databases, APIs, or tools directly.</text>
      </g>
    </g>
  </g>
</svg>
