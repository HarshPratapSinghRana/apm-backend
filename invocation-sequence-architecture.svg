<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.05" />
    </filter>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284C7" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C3AED" />
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706" />
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="skillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: Consolas, "SF Mono", "Fira Code", monospace; }
  </style>

  <!-- Background -->
  <rect width="1440" height="900" fill="#F8FAFC" rx="16" />

  <!-- Top Title Banner -->
  <g transform="translate(40, 25)">
    <rect width="1360" height="64" rx="12" fill="url(#headerGrad)" filter="url(#shadow)" />
    <text x="30" y="40" class="font-sans" font-size="20px" font-weight="800" fill="#FFFFFF">Engineering Commons — AI Artifact Invocation &amp; Lifecycle Sequences</text>
    <text x="1330" y="40" text-anchor="end" class="font-sans" font-size="12px" font-weight="600" fill="#94A3B8">VS Code Extension • Copilot Chat • Antigravity IDE</text>
  </g>

  <!-- Lifeline Columns -->
  <!-- Col 1: Developer (X=140) -->
  <line x1="140" y1="140" x2="140" y2="860" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,4" />
  <g transform="translate(60, 105)">
    <rect width="160" height="46" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="80" y="24" text-anchor="middle" class="font-sans" font-size="13px" font-weight="700" fill="#0F172A">👤 Enterprise Dev</text>
    <text x="80" y="38" text-anchor="middle" class="font-sans" font-size="10px" fill="#64748B">Workspace User</text>
  </g>

  <!-- Col 2: VS Code Extension (X=420) -->
  <line x1="420" y1="140" x2="420" y2="860" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,4" />
  <g transform="translate(330, 105)">
    <rect width="180" height="46" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.8" filter="url(#card-shadow)" />
    <text x="90" y="24" text-anchor="middle" class="font-sans" font-size="13px" font-weight="700" fill="#0369A1">🧩 VS Code Extension</text>
    <text x="90" y="38" text-anchor="middle" class="font-sans" font-size="10px" fill="#0284C7">engineering-commons-vscode</text>
  </g>

  <!-- Col 3: API Gateway & Storage (X=720) -->
  <line x1="720" y1="140" x2="720" y2="860" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,4" />
  <g transform="translate(630, 105)">
    <rect width="180" height="46" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8" filter="url(#card-shadow)" />
    <text x="90" y="24" text-anchor="middle" class="font-sans" font-size="13px" font-weight="700" fill="#6D28D9">⚡ Vercel / ADO API</text>
    <text x="90" y="38" text-anchor="middle" class="font-sans" font-size="10px" fill="#7C3AED">Serverless Gateway ($0)</text>
  </g>

  <!-- Col 4: Local Workspace Disk (X=1020) -->
  <line x1="1020" y1="140" x2="1020" y2="860" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,4" />
  <g transform="translate(930, 105)">
    <rect width="180" height="46" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.8" filter="url(#card-shadow)" />
    <text x="90" y="24" text-anchor="middle" class="font-sans" font-size="13px" font-weight="700" fill="#047857">📁 Workspace Disk</text>
    <text x="90" y="38" text-anchor="middle" class="font-sans" font-size="10px" fill="#059669">.github/ &amp; skills/ &amp; .cip/</text>
  </g>

  <!-- Col 5: AI Copilot Chat (X=1300) -->
  <line x1="1300" y1="140" x2="1300" y2="860" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,4" />
  <g transform="translate(1210, 105)">
    <rect width="180" height="46" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.8" filter="url(#card-shadow)" />
    <text x="90" y="24" text-anchor="middle" class="font-sans" font-size="13px" font-weight="700" fill="#C2410C">🤖 GitHub Copilot</text>
    <text x="90" y="38" text-anchor="middle" class="font-sans" font-size="10px" fill="#EA580C">Chat / Agent Picker</text>
  </g>

  <!-- ========================================== -->
  <!-- SECTION 1: AI AGENT WORKFLOW (@agent)      -->
  <!-- ========================================== -->
  <g transform="translate(50, 175)">
    <rect width="1340" height="210" rx="10" fill="url(#agentGrad)" stroke="#93C5FD" stroke-width="1.5" />
    <rect x="15" y="12" width="280" height="24" rx="12" fill="#1D4ED8" />
    <text x="155" y="28" text-anchor="middle" class="font-sans" font-size="11.5px" font-weight="800" fill="#FFFFFF">1. AI AGENT INSTALLATION &amp; @ INVOCATION</text>

    <!-- Step 1.1: Click Install -->
    <line x1="90" y1="65" x2="360" y2="65" stroke="#0284C7" stroke-width="2" marker-end="url(#arr-blue)" />
    <text x="225" y="58" text-anchor="middle" class="font-sans" font-size="11px" font-weight="600" fill="#0369A1">1. Click "Install to Workspace" on Agent (e.g. architecture-reviewer)</text>

    <!-- Step 1.2: Download package -->
    <line x1="370" y1="90" x2="660" y2="90" stroke="#0284C7" stroke-width="2" marker-end="url(#arr-blue)" />
    <text x="515" y="83" text-anchor="middle" class="font-sans" font-size="11px" font-weight="600" fill="#0369A1">2. GET /api/artifacts/:id/download (with Bearer Token)</text>

    <!-- Step 1.3: Return & extract -->
    <line x1="660" y1="115" x2="370" y2="115" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-purple)" />
    <text x="515" y="108" text-anchor="middle" class="font-sans" font-size="11px" font-weight="600" fill="#6D28D9">3. Stream package files &amp; manifest</text>

    <!-- Step 1.4: Write to .github/agents -->
    <line x1="370" y1="140" x2="960" y2="140" stroke="#059669" stroke-width="2" marker-end="url(#arr-emerald)" />
    <text x="665" y="133" text-anchor="middle" class="font-sans" font-size="11px" font-weight="700" fill="#047857">4. Auto-write to .github/agents/&lt;name&gt;.agent.md</text>

    <!-- Step 1.5: Select in Copilot via @ -->
    <line x1="90" y1="165" x2="1240" y2="165" stroke="#EA580C" stroke-width="2" marker-end="url(#arr-amber)" />
    <text x="665" y="158" text-anchor="middle" class="font-sans" font-size="11.5px" font-weight="700" fill="#C2410C">5. Open Copilot Chat (Ctrl+Alt+I) ➔ Select @architecture-reviewer from Agent Dropdown</text>

    <!-- Step 1.6: Execute agent response -->
    <line x1="1240" y1="190" x2="90" y2="190" stroke="#EA580C" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-amber)" />
    <text x="665" y="183" text-anchor="middle" class="font-sans" font-size="11px" font-weight="600" fill="#9A3412">6. Copilot adopts specialized Agent persona, rules, and system directives</text>
  </g>

  <!-- ========================================== -->
  <!-- SECTION 2: AI SKILL WORKFLOW (/skill)      -->
  <!-- ========================================== -->
  <g transform="translate(50, 405)">
    <rect width="1340" height="210" rx="10" fill="url(#skillGrad)" stroke="#A7F3D0" stroke-width="1.5" />
    <rect x="15" y="12" width="280" height="24" rx="12" fill="#059669" />
    <text x="155" y="28" text-anchor="middle" class="font-sans" font-size="11.5px" font-weight="800" fill="#FFFFFF">2. AI SKILL INSTALLATION &amp; / INVOCATION</text>

    <!-- Step 2.1: Click Install -->
    <line x1="90" y1="65" x2="360" y2="65" stroke="#059669" stroke-width="2" marker-end="url(#arr-emerald)" />
    <text x="225" y="58" text-anchor="middle" class="font-sans" font-size="11px" font-weight="600" fill="#065F46">1. Click "Install to Workspace" on Skill (e.g. work-timeline-tracker)</text>

    <!-- Step 2.2: Download package -->
    <line x1="370" y1="90" x2="660" y2="90" stroke="#0284C7" stroke-width="2" marker-end="url(#arr-blue)" />
    <text x="515" y="83" text-anchor="middle" class="font-sans" font-size="11px" font-weight="600" fill="#0369A1">2. GET /api/artifacts/:id/download</text>

    <!-- Step 2.3: Return & extract -->
    <line x1="660" y1="115" x2="370" y2="115" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-purple)" />
    <text x="515" y="108" text-anchor="middle" class="font-sans" font-size="11px" font-weight="600" fill="#6D28D9">3. Return zipped package content</text>

    <!-- Step 2.4: Write to skills/ -->
    <line x1="370" y1="140" x2="960" y2="140" stroke="#059669" stroke-width="2" marker-end="url(#arr-emerald)" />
    <text x="665" y="133" text-anchor="middle" class="font-sans" font-size="11px" font-weight="700" fill="#047857">4. Auto-write to skills/&lt;name&gt;/SKILL.md &amp; .agents/skills/&lt;name&gt;/</text>

    <!-- Step 2.5: Search via / slash command -->
    <line x1="90" y1="165" x2="1240" y2="165" stroke="#059669" stroke-width="2" marker-end="url(#arr-emerald)" />
    <text x="665" y="158" text-anchor="middle" class="font-sans" font-size="11.5px" font-weight="700" fill="#065F46">5. Open Copilot Chat ➔ Type /work-timeline-tracker start "Feature X"</text>

    <!-- Step 2.6: Read SKILL.md & run -->
    <line x1="1240" y1="190" x2="970" y2="190" stroke="#059669" stroke-width="2" marker-end="url(#arr-emerald)" />
    <text x="1105" y="183" text-anchor="middle" class="font-sans" font-size="10.5px" font-weight="600" fill="#065F46">6. Copilot reads SKILL.md instructions</text>
  </g>

  <!-- ========================================== -->
  <!-- SECTION 3: MCP SERVER WORKFLOW             -->
  <!-- ========================================== -->
  <g transform="translate(50, 635)">
    <rect width="1340" height="210" rx="10" fill="url(#mcpGrad)" stroke="#FDE68A" stroke-width="1.5" />
    <rect x="15" y="12" width="280" height="24" rx="12" fill="#D97706" />
    <text x="155" y="28" text-anchor="middle" class="font-sans" font-size="11.5px" font-weight="800" fill="#FFFFFF">3. MCP (MODEL CONTEXT PROTOCOL) WORKFLOW</text>

    <!-- Step 3.1: Install MCP -->
    <line x1="90" y1="65" x2="360" y2="65" stroke="#D97706" stroke-width="2" marker-end="url(#arr-amber)" />
    <text x="225" y="58" text-anchor="middle" class="font-sans" font-size="11px" font-weight="600" fill="#92400E">1. Click "Install to Workspace" on MCP Server</text>

    <!-- Step 3.2: Configure settings.json -->
    <line x1="370" y1="95" x2="960" y2="95" stroke="#D97706" stroke-width="2" marker-end="url(#arr-amber)" />
    <text x="665" y="88" text-anchor="middle" class="font-sans" font-size="11px" font-weight="700" fill="#92400E">2. Register MCP server binary &amp; port in .vscode/settings.json &amp; .cip/</text>

    <!-- Step 3.3: Copilot tool discovery -->
    <line x1="1240" y1="130" x2="970" y2="130" stroke="#EA580C" stroke-width="2" marker-end="url(#arr-amber)" />
    <text x="1105" y="123" text-anchor="middle" class="font-sans" font-size="10.5px" font-weight="600" fill="#9A3412">3. Copilot discovers registered MCP tools</text>

    <!-- Step 3.4: Autonomous execution -->
    <line x1="90" y1="165" x2="1240" y2="165" stroke="#EA580C" stroke-width="2" marker-end="url(#arr-amber)" />
    <text x="665" y="158" text-anchor="middle" class="font-sans" font-size="11.5px" font-weight="700" fill="#9A3412">4. User prompts Copilot ➔ Copilot automatically invokes MCP tool functions</text>
  </g>
</svg>
